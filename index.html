<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WPK钻石充值中心</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui, sans-serif;
}
body{
    background-color: #f4f5f7;
    padding: 20px 16px;
    margin-bottom:0;
}
.header{
    text-align: center;
    margin-bottom:24px;
}
.header h1{
    font-size:24px;
    color:#222;
}
.header p{
    color:#666;
    margin-top:6px;
}
.card{
    background:#fff;
    border-radius:12px;
    padding:20px;
    margin-bottom:16px;
}
.card h3{
    margin-bottom:16px;
    color:#333;
}
input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    margin-bottom:14px;
    font-size:16px;
}
.btn{
    display:block;
    width:100%;
    background:#1677ff;
    color:white;
    padding:15px;
    text-align:center;
    border-radius:8px;
    border: none;
    font-weight:bold;
    font-size:16px;
    cursor: pointer;
    margin-bottom:12px;
}
.price-show{
    color:red;
    font-size:26px;
    font-weight:bold;
    text-align:center;
    margin:10px 0 16px;
}
img{
    display:block;
    margin:20px auto;
    border-radius:10px;
    width:220px;
}
.tip-text{
    color:#555;
    line-height:1.7;
    font-size:14px;
}
.rule{
    margin-top:10px;
    font-size:13px;
    color:#777;
    border-top:1px solid #eee;
    padding-top:12px;
}
.card:last-child{
    margin-bottom:0;
}
</style>
</head>
<body>
<div class="header">
    <h1>WPK钻石充值中心</h1>
    <p>官方渠道 · 秒到账 · 售后支持</p>
</div>
<div class="card">
    <h3>填写充值信息</h3>
    <input type="text" id="uidInput" placeholder="请输入UID">
    <input type="number" id="diamondInput" placeholder="输入钻石数量" oninput="calcByDiamond()">
    <input type="number" id="moneyInput" placeholder="输入付款金额(元)" oninput="calcByMoney()">
    <div class="price-show">应付：¥<span id="moneyView">0.00</span></div>
    <button class="btn" onclick="copyOrder()">复制订单信息</button>
</div>
<div class="card">
    <h3>联系客服</h3>
    <p class="tip-text">微信：xiajj009</p>
    <button class="btn" onclick="copyWechat()">复制微信号联系客服</button>
    <!-- 拿到企微客服链接后填到href=""里面 -->
    <a class="btn" href="" target="_blank">免加好友直接联系客服</a>
    <img src="b89333a10cfc76405ecc829b32d5bd5b.jpg" alt="微信二维码">
    <p style="text-align:center;color:#666;">微信扫码联系</p>
</div>
<div class="card">
    <h3>充值流程</h3>
    <p class="tip-text">
        ① 填写UID<br>
        ② 联系客服<br>
        ③ 完成付款<br>
        ④ 官方充值<br>
        ⑤ 到账确认
    </p>
</div>
<div class="card">
    <h3>服务条款 & 退款说明</h3>
    <p class="rule">
        1. 充值前请确认UID填写正确，充值成功后无法修改；<br>
        2. 充值为虚拟商品，到账后非系统故障不支持无理由退款；<br>
        3. 如长时间未到账，请直接联系客服核对订单；<br>
        4. 禁止使用非法资金充值，一经发现将停止服务。
    </p>
</div>
<script>
// 比例：1元 = 7.2钻石
const rate = 7.2;
// 最低充值金额(元)
const minMoney = 10;

// 输入钻石，自动算金额
function calcByDiamond(){
    let dia = document.getElementById("diamondInput").value;
    let money = dia / rate;
    document.getElementById("moneyInput").value = money.toFixed(2);
    document.getElementById("moneyView").innerText = money.toFixed(2);
}

// 输入金额，自动算钻石
function calcByMoney(){
    let money = document.getElementById("moneyInput").value;
    let dia = money * rate;
    document.getElementById("diamondInput").value = dia.toFixed(1);
    document.getElementById("moneyView").innerText = money;
}

function copyWechat() {
    navigator.clipboard.writeText("xiajj009");
    alert("微信号已复制：xiajj009");
}

function copyOrder(){
    const uid = document.getElementById("uidInput").value.trim();
    const diamond = document.getElementById("diamondInput").value;
    const money = parseFloat(document.getElementById("moneyInput").value);

    if(!uid){
        alert("请先填写UID！");
        return;
    }
    if(!diamond || !money){
        alert("请输入钻石或金额！");
        return;
    }
    if(money < minMoney){
        alert(`最低充值${minMoney}元！`);
        return;
    }

    const msg = `UID：${uid}，钻石：${diamond}，金额：¥${money.toFixed(2)}`;
    navigator.clipboard.writeText(msg);
    alert("订单信息已复制：\n"+msg);
}
</script>
</body>
</html>
